<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rana's Portfolio</title>
    <link rel="shortcut icon" href="img/logo.png" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <!-- box icon  -->
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- header section  -->
    <header class="header">
      <a href="" class="logo">Rana's Portfolio</a>

      <div class="bx bx-menu" id="menu-icon"></div>

      <nav class="navbar">
        <a href="#home" class="active">Home</a>
        <a href="#about">About</a>
        <a href="#education">Education</a>
        <a href="#skills">Skills</a>
        <a href="#contact">Contact Me</a>
      </nav>
    </header>

    <!-- home section  -->
    <section class="home" id="home">
      <div class="home-content">
        <h1>Hi, I am <span>Rana Chail</span></h1>

        <div class="text-animate">
          <span id="element"></span>
        </div>
        <p>
          Lorem ipsum dolor sit amet, consectetur adipisicing elit. Voluptatem
          ratione inventore eveniet vitae quibusdam, est, minima saepe aperiam
          modi et rem? Nulla, amet repellat. Alias.
        </p>

        <div class="btn-box">
            <a href="#" class="btn">Hire Me</a>
            <a href="#" class="btn">Let's Talk</a>
        </div>
      </div>
      <div class="home-social">
        <a href="#"><i class='bx bxl-linkedin'></i></a>
        <a href="#"><i class='bx bxl-github'></i></a>
        <a href="#"><i class='bx bxl-instagram' ></i></a>
      </div>
      <div class="home-imghover"></div>
    </section>

    <!-- This script is for Typing animation -->
    <script src="https://unpkg.com/typed.js@2.0.16/dist/typed.umd.js"></script>
    <script>
      var typed = new Typed("#element", {
        strings: [
          "Web Developer",
          "Video Editor",
          "Mechanical Engineer",
          "Mobile Photographer",
        ],
        typeSpeed: 80,
      });
    </script>
  </body>
</html>
